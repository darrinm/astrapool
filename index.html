<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playful Pool</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f4efe8; font: 12px/1.4 system-ui, sans-serif; }
      canvas { display: block; touch-action: none; }
      #hint { position: fixed; left: 12px; bottom: 10px; max-width: calc(100vw - 136px); color: #6b6259; pointer-events: none; background: rgba(255,255,255,0.8); padding: 3px 8px; border-radius: 6px; }
      #status { position: fixed; left: 12px; top: 12px; font-size: 14px; color: #3a342e; pointer-events: none; background: rgba(255,255,255,0.8); padding: 3px 8px; border-radius: 6px; }
      #status:empty { display: none; }
      #spin { position: fixed; right: 16px; bottom: 16px; width: 84px; height: 84px; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffffff, #cfc6b8 70%, #9a9084); border: 2px solid #6b6259; cursor: crosshair; }
      #spin::before, #spin::after { content: ''; position: absolute; background: rgba(0,0,0,0.25); }
      #spin::before { left: 50%; top: 8%; width: 1px; height: 84%; }
      #spin::after { top: 50%; left: 8%; height: 1px; width: 84%; }
      #style { position: fixed; right: 16px; bottom: 112px; display: flex; gap: 4px; }
      #mode { position: fixed; right: 16px; top: 12px; display: flex; gap: 4px; }
      #style[hidden], #mode[hidden] { display: none; }
      #style button, #mode button { font: inherit; padding: 4px 10px; border: 1px solid #c9bfb3; border-radius: 999px; background: #fff; color: #6b6259; cursor: pointer; }
      #style button.active, #mode button[aria-pressed="true"] { background: #3a342e; border-color: #3a342e; color: #fff; }
      #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(0,0,0,0.5) 100%); }
      #spin .dot { position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #c0392b; }
    </style>
  </head>
  <body>
    <div id="status"></div>
    <div id="spin" hidden><div class="dot"></div></div>
    <div id="style" hidden><button data-style="heads">Heads</button><button data-style="balls">Balls</button></div>
    <div id="vignette" hidden></div>
    <div id="mode" role="group" aria-label="Interaction mode" hidden><button data-mode="cue" aria-pressed="true">Cue</button><button data-mode="fling" aria-pressed="false">Drag &amp; fling</button></div>
    <div id="hint"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
